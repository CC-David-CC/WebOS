<!doctype html><html><body><script type="module">
const entry=new URLSearchParams(location.search).get('app');if(!entry||!entry.startsWith('/apps/pocket-rally/'))throw Error('Missing Pocket Rally bundle');
const styles=document.createElement('link');styles.rel='stylesheet';styles.href=entry.replace('index.mjs','index.css');document.head.append(styles);
const {mount}=await import(entry);
const files=new Map();let sequence=0;window.fileStore=files;window.targetPath='/Pocket Rally.game.json';
const context={owner:'test',path:value=>value.startsWith('/')?value:'/'+value,name:value=>String(value).replaceAll('/',''),valid:()=>true,files:{
 async read(path){if(!files.has(path))throw Error('File not found.');return files.get(path)},
async write(path,data,expected){const current=files.get(path)?.version??null;if(current!==expected)throw Error('File changed');if(window.delayWriteOnce){window.delayWriteOnce=false;window.writeStarted=true;await new Promise(resolve=>window.releaseWrite=resolve);window.writeStarted=false}const out={data:typeof data==='string'?new TextEncoder().encode(data):data,version:String(++sequence),status:'synced'};files.set(path,out);return out},
 async stat(path){const file=files.get(path);if(!file)throw Error('File not found.');return {version:file.version,status:file.status,bytes:file.data.byteLength}},
 subscribe(){return()=>''},
}};
const make=(tag,className='',text='')=>{const element=document.createElement(tag);element.className=className;element.textContent=text;return element};
globalThis.confirmAnswer=true;
window.createInstance=()=>{const controller=new AbortController(),win=make('section','window focused'),w={};const app=mount({signal:controller.signal,w,ui:{make,textButton:(label,action)=>{const button=make('button','',label);button.setAttribute('aria-label',label);button.addEventListener('click',action);return button},appInput:(label,value)=>{const input=make('input');input.setAttribute('aria-label',label);input.value=value||'';return input},confirm:async()=>globalThis.confirmAnswer},storage:{signedInSubject:()=> 'test',mirrorFileContext:async()=>context,pickFile:async()=>window.targetPath,pickFolder:async()=>'/'}});win.append(app.element);document.body.append(win);return{app,controller,win,w}};
window.instances=[createInstance(),createInstance()];
</script></body></html>
