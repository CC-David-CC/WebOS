<!doctype html>
<meta charset="utf-8">
<title>Crystal Defense isolated harness</title>
<body>
<script type="module">
const entry=new URLSearchParams(location.search).get('app');
if(!entry||!entry.startsWith('/apps/crystal-defense/'))throw Error('Missing Crystal Defense bundle');
const styles=document.createElement('link');styles.rel='stylesheet';styles.href=entry.replace('index.mjs','index.css');document.head.append(styles);
const {mount}=await import(entry);
const files=new Map();let sequence=0;
const context={owner:'test',path:value=>value.startsWith('/')?value:'/'+value,name:value=>String(value).replaceAll('/',''),valid:()=>true,files:{
 async read(path){if(!files.has(path))throw Error('File not found.');return files.get(path)},
 async write(path,data,expected){const current=files.get(path)?.version??null;if(current!==expected)throw Error('File changed');const out={data:typeof data==='string'?new TextEncoder().encode(data):data,version:String(++sequence),status:'synced'};files.set(path,out);return out},
 async stat(path){const file=files.get(path);if(!file)throw Error('File not found.');return {version:file.version,status:file.status,bytes:file.data.byteLength}},subscribe(){return()=>{}},
}};
const make=(tag,className='',text='')=>{const element=document.createElement(tag);element.className=className;element.textContent=text;return element};
window.fileStore=files;window.crystalFiles=context.files;window.targetPath='/Crystal Defense.game.json';
window.makeCrystal=()=>{const controller=new AbortController(),w={},app=mount({signal:controller.signal,w,ui:{make,textButton:(label,action)=>{const button=make('button','',label);button.setAttribute('aria-label',label);button.addEventListener('click',action);return button},appInput:(label,value)=>{const input=make('input');input.setAttribute('aria-label',label);input.value=value;return input},confirm:async message=>window.confirm(message)},storage:{signedInSubject:()=> 'test',mirrorFileContext:async()=>context,pickFile:async()=>window.targetPath,pickFolder:async()=>'/'}});const windowElement=make('div','window focused');windowElement.append(app.element);document.body.append(windowElement);return {app,controller,w,windowElement}};
window.instances=[makeCrystal(),makeCrystal()];
</script>
