<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chess Study isolated harness</title>
<body>
<script type="module">
const entry=new URLSearchParams(location.search).get('app');
if(!entry||!entry.startsWith('/apps/chess-study/'))throw Error('Missing Chess Study bundle');
const styles=document.createElement('link');styles.rel='stylesheet';styles.href=entry.replace('index.mjs','index.css');document.head.append(styles);
const {mount}=await import(entry);
const files=new Map();let sequence=0,pendingWrite=null;
const context={
 owner:'test',
 valid:()=>true,
 path:value=>value.startsWith('/')?value:'/'+value,
 name:value=>String(value).replaceAll('/',''),
 files:{
  async read(path){if(!files.has(path))throw Error('File not found.');return files.get(path)},
  async write(path,data,expected){
   if(window.holdWrites){window.writeStarted=true;await new Promise(resolve=>{pendingWrite=resolve})}
   const current=files.get(path)?.version??null;if(current!==expected)throw Error('File changed.');
   const out={data:typeof data==='string'?new TextEncoder().encode(data):data,version:String(++sequence),status:'synced'};files.set(path,out);return out
  },
  async stat(path){const file=files.get(path);if(!file)throw Error('File not found.');return{...file,bytes:file.data.byteLength}},
  subscribe(){return()=>{}},
  async sync(){},
 },
};
const make=(tag,className='',text='')=>{const element=document.createElement(tag);element.className=className;if(text!=='')element.textContent=text;return element};
window.fileStore=files;window.targetPath='/Chess Study.game.json';window.releaseWrite=()=>pendingWrite?.();
window.createInstance=()=>{
 const controller=new AbortController();
 const w={};
 const app=mount({
  signal:controller.signal,
  w,
  ui:{
   make,
   textButton(label,action){const element=document.createElement('button');element.textContent=label;element.setAttribute('aria-label',label);element.addEventListener('click',action);return element},
   appInput(label,value){const element=document.createElement('input');element.setAttribute('aria-label',label);element.value=value;return element},
   confirm:async message=>window.confirm(message),
   prompt:async(message,options={})=>window.prompt(message,options.value??''),
  },
  storage:{signedInSubject:()=> 'test',mirrorFileContext:async()=>context,pickFile:async()=>window.targetPath,pickFolder:async()=>'/'},
 });
 const windowElement=document.createElement('div');
 windowElement.className='window focused';
 windowElement.append(app.element);
 document.body.append(windowElement);
 return{app,controller,element:windowElement,w};
};
window.instances=[createInstance(),createInstance()];
</script>
