<!doctype html>
<meta charset="utf-8">
<title>Expression Puppet isolated harness</title>
<body>
<script type="module">
const entry = new URLSearchParams(location.search).get('app');
if (!entry || !entry.startsWith('/apps/expression-puppet/')) throw Error('Missing local test bundle');
const styles = document.createElement('link');
styles.rel = 'stylesheet';
styles.href = entry.replace('index.mjs', 'index.css');
document.head.append(styles);
const {mount} = await import(entry);

const files = new Map();
let sequence = 0;
const context = {
  owner: 'test',
  path(value) { return value.startsWith('/') ? value : '/' + value; },
  name(value) { return String(value).replaceAll('/', ''); },
  valid() { return true; },
  files: {
    async read(path) {
      if (!files.has(path)) throw Error('File not found.');
      return files.get(path);
    },
    async write(path, data, expected) {
      if (window.__holdWrite) await window.__holdWrite();
      const current = files.get(path)?.version ?? null;
      if (current !== expected) throw Error('File changed');
      const out = {data: typeof data === 'string' ? new TextEncoder().encode(data) : data, version: String(++sequence), status: 'synced'};
      files.set(path, out);
      return out;
    },
    async stat(path) {
      const file = files.get(path);
      if (!file) throw Error('File not found.');
      return {version: file.version, status: file.status, bytes: file.data.byteLength};
    },
    subscribe() { return () => {}; },
  },
};
const make = (tag, className = '', text = '') => {
  const element = document.createElement(tag);
  element.className = className;
  element.textContent = text;
  return element;
};
window.fileStore = files;
window.targetPath = '/Expression Puppet.game.json';
window.makePuppet = () => {
  const controller = new AbortController();
  const app = mount({
    signal: controller.signal,
    ui: {
      make,
      textButton(label, fn) {
        const element = make('button', '', label);
        element.type = 'button';
        element.setAttribute('aria-label', label);
        element.addEventListener('click', fn);
        return element;
      },
      appInput(label, value) {
        const element = make('input');
        element.setAttribute('aria-label', label);
        element.value = value;
        return element;
      },
      confirm: async message => window.confirm(message),
      prompt: async(message, options = {}) => window.prompt(message, options.value ?? ''),
    },
    storage: {
      signedInSubject: () => 'test',
      mirrorFileContext: async () => context,
      pickFile: async () => window.targetPath,
      pickFolder: async () => '/',
    },
  });
  const windowElement = make('div', 'window focused');
  windowElement.append(app.element);
  document.body.append(windowElement);
  return {app, controller};
};
window.instances = [makePuppet(), makePuppet()];
</script>
