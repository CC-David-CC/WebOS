<!doctype html>
<meta charset="utf-8">
<title>Story Cards isolated harness</title>
<body>
<script type="module">
const entry=new URLSearchParams(location.search).get('app');
if(!entry||!entry.startsWith('/apps/story-cards/'))throw Error('Missing Story Cards bundle');
const style=document.createElement('link');style.rel='stylesheet';style.href=entry.replace('index.mjs','index.css');document.head.append(style);
const {mount}=await import(entry);
const files=new Map();let version=0;
const context={owner:'test',path:value=>value.startsWith('/')?value:'/'+value,name:value=>String(value).replaceAll('/',''),valid:()=>true,files:{
 async read(path){if(!files.has(path))throw Error('File not found.');return files.get(path)},
 async write(path,data,expected){if((files.get(path)?.version??null)!==expected)throw Error('File changed');const out={data:typeof data==='string'?new TextEncoder().encode(data):data,version:String(++version),status:'synced'};files.set(path,out);return out},
 async stat(path){if(!files.has(path))throw Error('File not found.');const file=files.get(path);return {...file,bytes:file.data.byteLength}},
 subscribe(){return()=>{}}
}};
const make=(tag,className='',text='')=>{const element=document.createElement(tag);element.className=className;element.textContent=text;return element};
window.fileStore=files;window.storyFiles=context.files;window.targetPath='/Story Cards.game.json';window.confirmAnswer=true;
window.makeStory=()=>{const controller=new AbortController(),host={signal:controller.signal,w:{},ui:{make,textButton:(label,action)=>{const element=make('button');element.type='button';element.textContent=label;element.setAttribute('aria-label',label);element.addEventListener('click',action);return element},appInput:(label,value)=>{const element=make('input');element.setAttribute('aria-label',label);element.value=value;return element},confirm:async()=>window.confirmAnswer},storage:{signedInSubject:()=> 'test',mirrorFileContext:async()=>context,pickFile:async()=>window.targetPath,pickFolder:async()=>'/'}},view=mount(host);const windowElement=make('div','window focused');windowElement.dataset.storyWindow='';windowElement.append(view.element);document.body.append(windowElement);return {view,controller,windowElement,host}};
window.instances=[makeStory(),makeStory()];
</script>
</body>
