<!doctype html><html><head></head><body><script type="module">
const entry=new URLSearchParams(location.search).get('app');if(!entry||!entry.startsWith('/apps/falling-blocks/'))throw Error('Missing local test bundle');const link=document.createElement('link');link.rel='stylesheet';link.href=entry.replace('index.mjs','index.css');document.head.append(link);const {mount}=await import(entry);
const files=new Map();let current=0;window.fileStore=files;window.target=null;
const c={path:x=>x.startsWith('/')?x:'/'+x,name:x=>x,valid:()=>true,files:{async read(p){if(!files.has(p))throw Error('File not found.');return files.get(p);},async write(p,data,expected){const old=files.get(p);if((old?.version??null)!==expected)throw Error('File changed');const out={data,version:String(++current),status:'synced'};files.set(p,out);return out;}}};
const make=(tag,cls='',text='')=>{const e=document.createElement(tag);e.className=cls;e.textContent=text;return e;};
window.createInstance=()=>{const controller=new AbortController(),host={signal:controller.signal,ui:{make,textButton:(label,fn)=>{const e=make('button','',label);e.setAttribute('aria-label',label);e.addEventListener('click',fn);return e;},appInput:(label,value)=>{const e=make('input');e.setAttribute('aria-label',label);e.value=value;return e;},confirm:async message=>window.confirm(message),prompt:async(message,options={})=>window.prompt(message,options.value??'')},storage:{signedInSubject:()=> 'test',mirrorFileContext:async()=>c,pickFile:async()=>window.target,pickFolder:async()=>'/'}},app=mount(host);document.body.append(app.element);return {app,controller};};window.instances=[createInstance(),createInstance()];
</script></body></html>
