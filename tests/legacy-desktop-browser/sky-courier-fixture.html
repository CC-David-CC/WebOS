<!doctype html>
<meta charset="utf-8">
<title>Sky Courier isolated harness</title>
<body>
<script type="module">
const entry = new URLSearchParams(location.search).get('app');
if (!entry || !entry.startsWith('/apps/sky-courier/')) throw Error('Missing Sky Courier bundle');
const styles = document.createElement('link');
styles.rel = 'stylesheet';
styles.href = entry.replace('index.mjs', 'index.css');
document.head.append(styles);
const {mount} = await import(entry);
const files = new Map();
let version = 0;
const context = {
 title: '',
 path(value) { return value.startsWith('/') ? value : '/' + value; },
 name(value) { return String(value).replaceAll('/', ''); },
 valid() { return true; },
 owner: 'test',
 files: {
  async read(path) {
   if (!files.has(path)) throw Error('File not found.');
   return files.get(path);
  },
  async write(path, data, expected) {
   if ((files.get(path)?.version ?? null) !== expected) throw Error('File changed');
   const out = {data: typeof data === 'string' ? new TextEncoder().encode(data) : data, version: String(++version), status: 'synced'};
   files.set(path, out);
   return out;
  },
  async stat(path) {
   const file = files.get(path);
   if (!file) throw Error('File not found.');
   return {...file, bytes: file.data.byteLength};
  },
  subscribe() { return () => {}; },
 },
};
const make = (tag, className = '', text = '') => {
 const element = document.createElement(tag);
 element.className = className;
 element.textContent = text;
 return element;
};
window.fileStore = files;
window.fileContext = context;
window.target = '/Sky Courier.game.json';
window.makeCourier = () => {
 const controller = new AbortController();
 const w = {};
 const ui = {
  make,
  confirm: async message => window.confirm(message),
  prompt: async (message, options = {}) => window.prompt(message, options.value ?? ''),
  textButton(label, action) {
   const element = make('button', '', label);
   element.setAttribute('aria-label', label);
   element.addEventListener('click', action);
   return element;
  },
  appInput(label, value) {
   const element = make('input');
   element.setAttribute('aria-label', label);
   element.value = value;
   return element;
  },
 };
 const app = mount({w, signal: controller.signal, ui, storage: {
  signedInSubject: () => 'test',
  mirrorFileContext: async () => context,
  pickFile: async () => window.target,
  pickFolder: async () => '/',
 }});
 const win = make('div', 'window focused');
 win.append(app.element);
 document.body.append(win);
 return {app, controller, w, win};
};
window.instances = [makeCourier(), makeCourier()];
</script>
