<!doctype html><html><head><link rel="stylesheet" href="./style.css"><style>.jsketcher-app{width:100%;height:680px}</style></head><body><script type="module">
import {mount} from './host.mjs';
window.currentOwner='user:a';window.data=new Map();window.messages=[];window.pick=[];window.prompts=[];window.confirms=[];window.views=[];window.waitWrite=null;
const make=(tag,cls='',text='')=>{const el=document.createElement(tag);el.className=cls;el.textContent=text;return el},textButton=(label,fn)=>{const b=make('button','',label);b.onclick=fn;return b};
function context(owner){const key=p=>owner+':'+p;return {owner,valid:()=>window.currentOwner===owner,path(p){if(!p.startsWith('/')||p.includes('..'))throw Error('Bad path');return p},files:{async stat(p){const e=data.get(key(p));if(!e)throw Error('File not found.');return {version:e.version,status:e.status||'synced'}},async read(p){const e=data.get(key(p));if(!e)throw Error('File not found.');return {data:new TextEncoder().encode(e.value),version:e.version,status:e.status||'synced'}},async write(p,value,expected){window.writeStarted=true;if(window.waitWrite)await window.waitWrite;const e=data.get(key(p));if((e?.version||null)!==expected)throw Error('The file changed.');const result={value,version:crypto.randomUUID(),status:'pending'};data.set(key(p),result);return result},subscribe(){return ()=>{window.unsubscribed=(window.unsubscribed||0)+1}}}}}
window.launch=()=>{const controller=new AbortController(),owner=currentOwner,w={},host={w,signal:controller.signal,ui:{make,textButton,async prompt(){return prompts.shift()??null},async confirm(){return confirms.shift()??false}},storage:{signedInSubject:()=>currentOwner,mirrorFileContext:async()=>context(owner),pickFile:async()=>pick.shift()||null}};const view=mount(host);document.body.append(view.element);views.push({w,view,controller,owner});return views.length-1};
window.closeView=i=>{const x=views[i];x.controller.abort();x.view.dispose();x.view.element.remove()};
</script></body></html>
