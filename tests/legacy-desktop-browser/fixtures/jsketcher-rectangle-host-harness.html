<!doctype html><html><head><link rel="stylesheet" href="./style.css"><style>.jsketcher-app{width:100%;height:680px}</style></head><body><script type="module">

window.currentOwner='user:a';window.data=new Map();window.messages=[];window.pick=[];window.prompts=[];window.confirms=[];window.views=[];window.waitWrite=null;window.waitWritePath=null;window.waitRead=null;window.readStarted=false;

</script></body></html>
